<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma de Actividades</title>
<style>
:root{
  --brand-gold:#f7c600;
  --brand-gold-deep:#dcae00;
  --brand-navy:#111d42;
  --brand-navy-soft:#203968;
  --brand-crimson:#c8203a;
  --primary:var(--brand-gold);
  --primary-hover:var(--brand-gold-deep);
  --secondary:var(--brand-navy);
  --secondary-hover:var(--brand-navy-soft);
  --on-primary:#111d42;
  --on-secondary:#ffffff;
  --bg:#f6f7f9;
  --card:#ffffff;
  --surface-muted:#f1f3f6;
  --input-bg:#ffffff;
  --text:#10182f;
  --muted:#5f6878;
  --border:#d8dce3;
  --border-strong:#b9c0cc;
  --shadow-sm:0 1px 2px rgba(17,29,66,.06);
  --shadow-md:0 10px 28px rgba(17,29,66,.10);
  --shadow-lg:0 24px 60px rgba(17,29,66,.22);
  --radius-sm:10px;
  --radius-md:14px;
  --radius-lg:18px;
  --pending:#9c6800;
  --pending-bg:#fff8dd;
  --approved:#263f73;
  --approved-bg:#edf1f9;
  --done:#087a5b;
  --done-bg:#eafaf4;
}
body.dark-mode{
  --brand-gold:#ffd64d;
  --brand-gold-deep:#e5b800;
  --brand-navy:#111d42;
  --brand-navy-soft:#203968;
  --brand-crimson:#ff7187;
  --primary:var(--brand-gold);
  --primary-hover:var(--brand-gold-deep);
  --secondary:#8eaeeb;
  --secondary-hover:#b5cdfa;
  --on-primary:#111d42;
  --on-secondary:#10182f;
  --bg:#0d1322;
  --card:#151d2e;
  --surface-muted:#1d283b;
  --input-bg:#1d283b;
  --text:#f4f6fb;
  --muted:#b3bdce;
  --border:#344158;
  --border-strong:#4d5e78;
  --shadow-sm:0 1px 2px rgba(0,0,0,.18);
  --shadow-md:0 12px 30px rgba(0,0,0,.2);
  --shadow-lg:0 24px 60px rgba(0,0,0,.42);
  --pending:#ffd76a;
  --pending-bg:#3a3015;
  --approved:#b7cbff;
  --approved-bg:#26365b;
  --done:#61d6ae;
  --done-bg:#12372e;
}
*{box-sizing:border-box;transition:background-color .25s ease,color .25s ease,border-color .25s ease,box-shadow .25s ease;}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden;}
header{background:linear-gradient(135deg,#0b1532 0%,var(--brand-navy) 58%,#203968 100%);color:#fff;padding:40px 22px;box-shadow:inset 0 -3px var(--primary),inset 0 -1px rgba(255,255,255,.12);}
body.dark-mode header{background:linear-gradient(135deg,#090f20 0%,var(--brand-navy) 58%,#1c315c 100%);}
.container{max-width:1150px;width:100%;margin:auto;}
.header-flex{display:flex;align-items:center;justify-content:space-between;gap:20px;}
h1{margin:0 0 7px;font-size:clamp(1.8rem,4vw,2.7rem);font-weight:800;letter-spacing:-.035em;line-height:1.14;}
.subtitle{margin:0;color:rgba(255,255,255,.82);font-size:1rem;}
.theme-btn{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:46px;height:46px;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:50%;font-size:20px;cursor:pointer;box-shadow:var(--shadow-sm);}
.theme-btn:hover{background:rgba(255,255,255,.24);box-shadow:0 6px 16px rgba(0,0,0,.15);}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 24px;}
button,.file-label{border:0;border-radius:var(--radius-sm);padding:11px 15px;font:inherit;font-size:.9rem;font-weight:700;line-height:1.2;cursor:pointer;}
.filter{color:var(--muted);background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-sm);}
.filter:hover{color:var(--secondary);border-color:var(--border-strong);}
.filter.active{color:var(--on-primary);background:var(--primary);border-color:var(--primary);box-shadow:0 5px 12px rgba(220,174,0,.24);}
main{width:100%;padding:28px 18px 58px;overflow-x:hidden;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
.stat{padding:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);}
.stat strong{display:block;margin-bottom:2px;font-size:1.7rem;font-weight:800;letter-spacing:-.035em;line-height:1.2;}.stat span{color:var(--muted);font-size:.82rem;font-weight:600;}
.timeline{position:relative;padding:2px 0 4px;}
.timeline:before{position:absolute;top:10px;bottom:10px;left:20px;width:3px;content:"";background:linear-gradient(to bottom,var(--primary),var(--border) 13%,var(--border) 87%,var(--primary));border-radius:999px;}
.activity{position:relative;width:100%;margin:0 0 22px;padding-left:58px;}
.dot{position:absolute;z-index:1;top:24px;left:8px;width:27px;height:27px;background:var(--primary);border:6px solid var(--bg);border-radius:50%;box-shadow:0 0 0 1px color-mix(in srgb,var(--primary) 70%,var(--border)),0 4px 10px rgba(17,29,66,.14);transition:transform .2s ease,box-shadow .2s ease;}
.activity:hover .dot{transform:scale(1.08);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent),0 5px 12px rgba(17,29,66,.18);}
.card{position:relative;width:100%;max-width:100%;overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;}
.card::before{position:absolute;top:0;right:0;left:0;height:3px;content:"";background:var(--primary);opacity:0;transition:opacity .2s ease;}
.card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md);transform:translateY(-1px);}
.card:hover::before,.card.open::before{opacity:1;}
.card.open{border-color:color-mix(in srgb,var(--primary) 45%,var(--border));box-shadow:var(--shadow-md);}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:23px 22px 21px;cursor:pointer;transition:background-color .2s ease;}
.card-head:hover{background:color-mix(in srgb,var(--primary) 7%,var(--card));}
.card.open .card-head{background:color-mix(in srgb,var(--primary) 8%,var(--card));}
.card-head-content{flex:1;min-width:0;}
.date{display:inline-flex;align-items:center;min-height:27px;padding:5px 9px;margin-bottom:10px;color:var(--on-primary);background:var(--primary);border-radius:999px;font-size:.73rem;font-weight:800;letter-spacing:.055em;line-height:1;text-transform:uppercase;box-shadow:0 2px 5px rgba(220,174,0,.2);}
body.dark-mode .date{color:var(--on-primary);}
.title{margin:0 0 10px;color:var(--text);font-size:clamp(1.2rem,2vw,1.4rem);font-weight:800;letter-spacing:-.025em;line-height:1.28;word-break:break-word;}
.responsible{color:var(--muted);font-size:.88rem;line-height:1.55;word-break:break-word;}
.activity-location,.activity-responsible{display:flex;align-items:flex-start;gap:6px;}
.activity-location{margin-bottom:3px!important;color:var(--secondary)!important;font-weight:600;}
.activity-responsible{color:var(--muted);}
.badge{flex-shrink:0;min-width:92px;padding:7px 10px;border-radius:999px;font-size:.71rem;font-weight:800;letter-spacing:.025em;line-height:1.1;text-align:center;white-space:nowrap;}
.pending{color:var(--pending);background:var(--pending-bg);border:1px solid color-mix(in srgb,var(--pending) 35%,transparent);}
.approved{color:var(--approved);background:var(--approved-bg);border:1px solid color-mix(in srgb,var(--approved) 35%,transparent);}
.done{color:var(--done);background:var(--done-bg);border:1px solid color-mix(in srgb,var(--done) 35%,transparent);}
.details{display:none;width:100%;padding:22px;border-top:1px solid color-mix(in srgb,var(--primary) 28%,var(--border));background:color-mix(in srgb,var(--primary) 4%,var(--surface-muted));}
.card.open .details{display:block;animation:reveal-details .22s ease-out;}
@keyframes reveal-details{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;align-items:start;width:100%;gap:36px;}
.section-title{margin-bottom:9px;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
.notes-log{max-height:250px;min-height:54px;padding:12px;background:var(--surface-muted);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.88rem;overflow-wrap:anywhere;overflow-y:auto;word-break:break-word;}
.notes-log a{color:var(--secondary);font-weight:700;word-break:break-all;}
.notes{width:100%;max-width:100%;min-height:76px;padding:11px 12px;color:var(--text);background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius-sm);font:inherit;resize:vertical;}
.files{display:flex;flex-direction:column;width:100%;gap:9px;}
.file-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;padding:10px 11px;background:var(--surface-muted);border:1px solid var(--border);border-radius:var(--radius-sm);}
.file-name{flex:1;min-width:0;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-actions{display:flex;flex-shrink:0;gap:6px;}
.file-actions button{padding:6px 9px;font-size:.75rem;}
.add{color:var(--on-primary);background:var(--primary);box-shadow:0 4px 10px rgba(220,174,0,.22);}
.add:hover{background:var(--primary-hover);}
.toggle{color:var(--on-secondary);background:var(--secondary);opacity:1;}
.toggle:hover{background:var(--secondary-hover);}
.delete{color:var(--brand-crimson);background:transparent;border:1px solid transparent;}
.delete:hover{background:#fff1f3;border-color:#f5c5cd;}
body.dark-mode .delete{color:var(--brand-crimson);background:transparent;border-color:transparent;}
body.dark-mode .delete:hover{background:#431f29;border-color:#743443;}
.empty{color:var(--muted);font-size:.88rem;font-style:italic;}
.card-foot{display:flex;justify-content:flex-end;width:100%;gap:8px;padding:14px 22px;background:var(--card);border-top:1px solid var(--border);}
.card-foot .toggle{box-shadow:var(--shadow-sm);}
.card-foot .delete{font-weight:700;}
button:focus-visible,.file-label:focus-within,select:focus-visible,input:focus-visible,.notes:focus-visible{outline:3px solid color-mix(in srgb,var(--primary) 55%,transparent);outline-offset:2px;}
.card:focus-within{border-color:color-mix(in srgb,var(--primary) 65%,var(--border));box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent),var(--shadow-md);}
select,input{width:100%;max-width:100%;padding:9px 10px;color:var(--text);background:var(--input-bg);border:1px solid var(--border);border-radius:var(--radius-sm);font:inherit;font-size:.9rem;font-weight:600;}
.help{padding:16px 18px;margin-bottom:22px;color:var(--text);background:var(--card);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);}
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(5,14,29,.62);overflow-y:auto;}
.modal.show{display:flex;}.modal-box{width:min(560px,100%);max-height:90vh;padding:26px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);overflow-y:auto;}
.modal-box h2{margin:0 0 20px;font-size:1.45rem;letter-spacing:-.025em;}.form-grid{display:grid;gap:14px;}.form-grid label{color:var(--muted);font-size:.78rem;font-weight:800;letter-spacing:.025em;}
.form-grid input,.form-grid select{width:100%;padding:11px;border:1px solid var(--border);border-radius:var(--radius-sm);font:inherit;margin-top:5px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.cancel{color:var(--text);background:var(--surface-muted);border:1px solid var(--border);}
.cancel:hover{border-color:var(--border-strong);background:var(--bg);}

/* --- MEJORAS RESPONSIVAS PARA MÓVILES --- */
@media(max-width:700px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .detail-grid{grid-template-columns:1fr; gap:25px;}
 .activity{padding-left:38px}
 .timeline:before{left:9px}
 .dot{left:-2px; width:23px; height:23px; border-width:5px;}
 .header-flex{flex-direction:column; align-items:flex-start;}
 .theme-btn{position:absolute; top:34px; right:22px;}
 .card-head {gap:10px;padding:18px 15px;}
 .details {padding:18px 15px;}
 .card-foot {padding:12px 15px; flex-wrap: wrap; justify-content: stretch;}
 .card-foot button {flex: 1; text-align: center; justify-content: center;}
 .file-row {flex-direction: column; align-items: stretch; gap: 8px;}
 .file-name {white-space: normal; word-break: break-word;}
 .file-actions {justify-content: flex-end;}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
  <div class="container header-flex">
    <div>
      <h1>📅 Cronograma de Actividades</h1>
      <p class="subtitle">Planificación, responsables y archivos de cada actividad</p>
    </div>
    <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
  </div>
</header>

<main class="container">
  <div class="toolbar">
    <button class="add" onclick="openActivityModal()">＋ Nueva actividad</button>
    <button class="filter active" data-filter="all">Todas</button>
    <button class="filter" data-filter="pending">Pendientes</button>
    <button class="filter" data-filter="approved">Aprobadas</button>
    <button class="filter" data-filter="done">Completadas</button>
  </div>

  <div class="stats">
    <div class="stat"><strong id="total">0</strong><span>Actividades</span></div>
    <div class="stat"><strong id="pendingCount">0</strong><span>Pendientes</span></div>
    <div class="stat"><strong id="approvedCount">0</strong><span>Aprobadas</span></div>
    <div class="stat"><strong id="doneCount">0</strong><span>Completadas</span></div>
  </div>

  <div class="help">
    <b>💡 Cómo usarlo:</b> Haz clic sobre el título de cualquier actividad para abrir sus detalles, guardar enlaces, agregar notas y gestionar archivos.
  </div>

  <section id="timeline" class="timeline"></section>
</main>

<div class="modal" id="activityModal">
 <div class="modal-box">
  <h2 id="modalTitle">Nueva actividad</h2>
  <div class="form-grid">
   <div><label>Actividad</label><input id="fTitle" placeholder="Nombre de la actividad"></div>
   <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
     <div><label>Fecha inicio</label><input type="date" id="fDateStart"></div>
     <div><label>Fecha fin (opcional)</label><input type="date" id="fDateEnd"></div>
   </div>
   <div><label>Sedes / Desglose de fechas</label><input id="fLocation" placeholder="Ej. Cúcuta 14, Villa 15, Pamplona 16"></div>
   <div><label>Responsable(s)</label><input id="fResponsible" placeholder="Nombre del responsable"></div>
   <div>
     <label>Estado</label>
     <select id="fStatus">
       <option value="pending">Pendiente</option>
       <option value="approved">Aprobado</option>
       <option value="done">Completada</option>
     </select>
   </div>
  </div>
  <div class="modal-actions">
   <button class="cancel" onclick="closeActivityModal()">Cancelar</button>
   <button class="add" onclick="saveActivity()">Guardar actividad</button>
  </div>
 </div>
</div>

<script>
// --- CONFIGURACIÓN DE TEMA OSCURO ---
function toggleTheme() {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
}
if(localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark-mode');
  document.getElementById('themeToggle').textContent = '☀️';
}
// ------------------------------------

const { createClient } = supabase;
const supabaseUrl = 'https://kakbjyjonxtbhobeiblv.supabase.co';
const supabaseKey = 'sb_publishable_BiXNML_8PgA2x6pd6UPWWg_EGJ8tMUW';
const supabaseClient = createClient(supabaseUrl, supabaseKey);

let activities = [];
let filesData = {};
const statusText={pending:"Pendiente", approved:"Aprobado", done:"Completada"};
let currentFilter="all";
let editingId=null;
let openCards = []; 

async function fetchData(){
  const { data: acts } = await supabaseClient.from('cronograma_actividades').select('*').order('id', { ascending: true });
  if(acts) activities = acts;
  const { data: files } = await supabaseClient.from('cronograma_archivos').select('*');
  filesData = {};
  if(files){
    files.forEach(f => {
      if(!filesData[f.activity_id]) filesData[f.activity_id] = [];
      filesData[f.activity_id].push(f);
    });
  }
  render();
}

supabaseClient.channel('realtime_sync')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'cronograma_actividades' }, payload => fetchData())
  .on('postgres_changes', { event: '*', schema: 'public', table: 'cronograma_archivos' }, payload => fetchData())
  .subscribe();

function openActivityModal(id=null){
 editingId=id;
 const a=id?activities.find(x=>x.id===id):null;
 document.getElementById("modalTitle").textContent=a?"Editar actividad":"Nueva actividad";
 document.getElementById("fTitle").value=a?.title||"";
 
 let dateStartVal = "";
 let dateEndVal = "";
 if(a?.date){
   const parts = a.date.split(' - ');
   const d1 = parts[0];
   const d2 = parts[1];
   if(d1){
     const p1 = d1.split('/');
     if(p1.length === 3) dateStartVal = `${p1[2]}-${p1[1].padStart(2, '0')}-${p1[0].padStart(2, '0')}`;
   }
   if(d2){
     const p2 = d2.split('/');
     if(p2.length === 3) dateEndVal = `${p2[2]}-${p2[1].padStart(2, '0')}-${p2[0].padStart(2, '0')}`;
   }
 }
 document.getElementById("fDateStart").value=dateStartVal;
 document.getElementById("fDateEnd").value=dateEndVal;
 document.getElementById("fLocation").value=a?.location||"";
 document.getElementById("fResponsible").value=a?.responsible||"";
 document.getElementById("fStatus").value=a?.status||"pending";
 document.getElementById("activityModal").classList.add("show");
}

function closeActivityModal(){document.getElementById("activityModal").classList.remove("show");}

async function saveActivity(){
 const title=document.getElementById("fTitle").value.trim();
 let rawStart = document.getElementById("fDateStart").value;
 let rawEnd = document.getElementById("fDateEnd").value;
 let finalDate = "";
 let d1Str = "";
 if(rawStart){
   const p = rawStart.split('-');
   if(p.length === 3) d1Str = `${p[2]}/${p[1]}/${p[0]}`;
 }
 let d2Str = "";
 if(rawEnd){
   const p = rawEnd.split('-');
   if(p.length === 3) d2Str = `${p[2]}/${p[1]}/${p[0]}`;
 }
 if(d1Str && d2Str && d1Str !== d2Str){
   finalDate = `${d1Str} - ${d2Str}`;
 } else if(d1Str) {
   finalDate = d1Str;
 }
 const location=document.getElementById("fLocation").value.trim();
 const responsible=document.getElementById("fResponsible").value.trim();
 const status=document.getElementById("fStatus").value;
 
 if(!title||!finalDate||!responsible){alert("Completa actividad, fecha de inicio y responsable.");return;}
 
 if(editingId){
   await supabaseClient.from('cronograma_actividades').update({title, date: finalDate, location, responsible, status}).eq('id', editingId);
 } else {
   await supabaseClient.from('cronograma_actividades').insert([{title, date: finalDate, location, responsible, status}]);
 }
 closeActivityModal();
}

function editActivity(id, e){
  e.stopPropagation();
  openActivityModal(id);
}

async function deleteActivity(id, e){
 e.stopPropagation();
 const a=activities.find(x=>x.id===id);
 if(!a)return;
 if(confirm(`¿Eliminar "${a.title}"? Esta acción no se puede deshacer.`)){
   await supabaseClient.from('cronograma_actividades').delete().eq('id', id);
 }
}

function activityDateValue(a){
 const m = String(a.date).match(/(\d{1,2})\D+(\d{1,2})(?:\D+(\d{2,4}))?/);
 if(!m) return Number.MAX_SAFE_INTEGER;
 const day = Number(m[1]), month = Number(m[2]);
 let year = m[3] ? Number(m[3]) : new Date().getFullYear();
 if(year < 100) year += 2000;
 return new Date(year, month-1, day).getTime();
}

function toggleCard(id){
  const card = document.getElementById("card-"+id);
  card.classList.toggle("open");
  if(card.classList.contains("open")){
    if(!openCards.includes(id)) openCards.push(id);
  } else {
    openCards = openCards.filter(x => x !== id);
  }
}

function linkify(text) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return escapeHtml(text).replace(urlRegex, function(url) {
    return `<a href="${url}" target="_blank">${url}</a>`;
  });
}

function escapeHtml(s){
 return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

// --- LÓGICA PARA RENDERIZAR Y BORRAR NOTAS ---
function renderNotesLog(id, rawNotes) {
  if(!rawNotes) return '<div class="empty">Aún no hay notas registradas.</div>';
  let notesArray = rawNotes.split('\n\n• ').filter(n => n.trim() !== '');
  notesArray = notesArray.map(n => n.replace(/^•\s*/, ''));
  
  return notesArray.map((note, idx) => `
    <div style="display:flex; justify-content:space-between; gap:10px; margin-bottom:10px; border-bottom:1px solid var(--border); padding-bottom:10px;">
      <div style="flex:1; white-space:pre-wrap; word-break:break-word;">${linkify(note)}</div>
      <button class="delete" style="padding:4px 8px; font-size:10px; height:max-content; border-radius:6px;" onclick="deleteNote(${id}, ${idx})" title="Borrar nota">❌</button>
    </div>
  `).join('');
}

async function deleteNote(id, index) {
  if(!confirm("¿Seguro que quieres borrar esta nota del registro?")) return;
  const a = activities.find(x => x.id === id);
  let notesArray = a.notes.split('\n\n• ').filter(n => n.trim() !== '');
  notesArray = notesArray.map(n => n.replace(/^•\s*/, ''));
  
  notesArray.splice(index, 1);
  let newNotes = notesArray.map(n => "• " + n).join('\n\n');
  if(newNotes === "") newNotes = null;
  
  const { error } = await supabaseClient.from('cronograma_actividades').update({notes: newNotes}).eq('id', id);
  if(error) alert("Error al borrar la nota: " + error.message);
}
// ---------------------------------------------

function render(){
 const box=document.getElementById("timeline"); box.innerHTML="";
 let shown=activities.filter(a=>currentFilter==="all"||a.status===currentFilter);
 shown.sort((a,b)=>activityDateValue(a)-activityDateValue(b));
 shown.forEach(a=>{
  const fList = filesData[a.id] || [];
  const isOpen = openCards.includes(a.id) ? 'open' : '';
  
  const el=document.createElement("article");
  el.className="activity";
  el.innerHTML=`
   <div class="dot"></div>
   <div class="card ${isOpen}" id="card-${a.id}">
    
    <div class="card-head" onclick="toggleCard(${a.id})" title="Haz clic para ver o cerrar detalles">
     <div class="card-head-content">
      <div class="date">${a.date}</div>
      <h2 class="title">${a.title}</h2>
      ${a.location ? `<div class="responsible activity-location" style="margin-bottom:4px; color:var(--secondary)">📍 <b>Sedes:</b> ${a.location}</div>` : ''}
      <div class="responsible activity-responsible">👤 <b>Responsable:</b> ${a.responsible}</div>
     </div>
     <span class="badge ${a.status}">${statusText[a.status]}</span>
    </div>
    
    <div class="details">
     <div class="detail-grid">
      
      <div>
       <div class="section-title">Actualizar Estado</div>
       <select onchange="changeStatus(${a.id},this.value)">
        <option value="pending" ${a.status==="pending"?"selected":""}>Pendiente</option>
        <option value="approved" ${a.status==="approved"?"selected":""}>Aprobado</option>
        <option value="done" ${a.status==="done"?"selected":""}>Completada</option>
       </select>
       
       <div class="section-title" style="margin-top:24px">Historial de Observaciones y Enlaces</div>
       <div class="notes-log">
          ${renderNotesLog(a.id, a.notes)}
       </div>
       <textarea id="new-note-${a.id}" class="notes" placeholder="Escribe una nueva nota o pega un link aquí..."></textarea>
       <button class="add" style="margin-top:8px" onclick="appendNote(${a.id},this)">Guardar en el registro</button>
      </div>
      
      <div>
       <div class="section-title">Archivos correspondientes</div>
       <div class="files" id="files-${a.id}">
        ${fileHTML(a,fList)}
       </div>
       <label class="file-label add" style="display:inline-block;margin-top:10px">
        📎 Agregar archivo
        <input type="file" multiple hidden onchange="addFiles(${a.id},this)">
       </label>
      </div>
     
     </div>
    </div>
    
    <div class="card-foot">
      <button class="toggle" onclick="editActivity(${a.id}, event)">✏️ Editar Actividad</button>
      <button class="delete" onclick="deleteActivity(${a.id}, event)">🗑️ Eliminar Actividad</button>
    </div>
   </div>
  `;
  box.appendChild(el);
 });
 updateStats();
}

function fileHTML(a,files){
 if(!files.length)return '<div class="empty">No hay archivos asociados todavía.</div>';
 return files.map(f=>`
  <div class="file-row">
   <span class="file-name" title="${escapeHtml(f.name)}">📄 ${escapeHtml(f.name)}</span>
   <div class="file-actions">
    <button class="toggle" onclick="downloadFile('${f.path}')">Abrir</button>
    <button class="delete" onclick="removeFile(${f.id}, '${f.path}')">Eliminar</button>
   </div>
  </div>`).join("");
}

async function changeStatus(id,status){
 await supabaseClient.from('cronograma_actividades').update({status}).eq('id', id);
}

async function appendNote(id, btn){
 const textarea = document.getElementById("new-note-"+id);
 const newText = textarea.value.trim();
 if(!newText) return;
 btn.textContent = "⏳ Guardando...";
 const a = activities.find(x => x.id === id);
 let updatedNotes = a.notes ? a.notes + "\n\n• " + newText : "• " + newText;
 const { error } = await supabaseClient.from('cronograma_actividades').update({notes: updatedNotes}).eq('id', id);
 if(error){
   alert("Error al guardar: " + error.message);
   btn.textContent = "Guardar en el registro";
 } else {
   textarea.value = "";
   btn.textContent = "✓ ¡Guardado!";
   setTimeout(() => btn.textContent = "Guardar en el registro", 1500);
 }
}

async function addFiles(id, input){
  const files = Array.from(input.files);
  if (files.length === 0) return;
  const labelDiv = input.parentElement;
  const originalText = labelDiv.innerHTML;
  labelDiv.innerHTML = "⏳ Subiendo...";
  try {
    for(let file of files){
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
      const { error: uploadError } = await supabaseClient.storage.from('cronograma-archivos').upload(fileName, file);
      if(uploadError){
        alert("Error al subir el archivo: " + uploadError.message);
      } else {
        const { error: dbError } = await supabaseClient.from('cronograma_archivos').insert([{activity_id: id, name: file.name, path: fileName, type: file.type}]);
        if(dbError) alert("Error en base de datos: " + dbError.message);
      }
    }
    await fetchData(); 
  } catch (err) {
    alert("Fallo inesperado: " + err.message);
  } finally {
    labelDiv.innerHTML = originalText;
    input.value = "";
  }
}

async function downloadFile(path){
 const { data } = supabaseClient.storage.from('cronograma-archivos').getPublicUrl(path);
 if(data) window.open(data.publicUrl, '_blank');
}

async function removeFile(fileId, path){
 if(confirm("¿Seguro que quieres eliminar este archivo?")){
   await supabaseClient.storage.from('cronograma-archivos').remove([path]);
   await supabaseClient.from('cronograma_archivos').delete().eq('id', fileId);
 }
}

function updateStats(){
 document.getElementById("total").textContent=activities.length;
 document.getElementById("pendingCount").textContent=activities.filter(a=>a.status==="pending").length;
 document.getElementById("approvedCount").textContent=activities.filter(a=>a.status==="approved").length;
 document.getElementById("doneCount").textContent=activities.filter(a=>a.status==="done").length;
}

document.querySelectorAll(".filter").forEach(btn=>{
 btn.addEventListener("click",()=>{
  document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active"); currentFilter=btn.dataset.filter; render();
 });
});

document.getElementById("activityModal").addEventListener("click",e=>{if(e.target.id==="activityModal")closeActivityModal();});
window.onload = fetchData;
</script>
</body>
</html>
