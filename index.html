<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma de Actividades</title>
<style>
:root{
  --primary:#182848; --secondary:#4b6cb7; --bg:#f4f6fa;
  --card:#fff; --text:#20242a; --muted:#707782;
  --pending:#f59e0b; --approved:#3b82f6; --done:#10b981;
  --border:#e4e7ec; --input-bg:#fff;
}
body.dark-mode {
  --primary:#0f172a; --secondary:#3b82f6; --bg:#020617;
  --card:#0f172a; --text:#f8fafc; --muted:#94a3b8;
  --border:#1e293b; --input-bg:#1e293b;
  --pending:#d97706; --approved:#2563eb; --done:#059669;
}
*{box-sizing:border-box; transition: background-color 0.3s, color 0.3s;}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text); overflow-x:hidden;}
header{background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;padding:34px 22px}
.container{max-width:1150px;margin:auto; width: 100%;}
.header-flex{display:flex; justify-content:space-between; align-items:center; gap:20px;}
h1{margin:0 0 8px;font-size:clamp(24px,5vw,42px)}
.subtitle{margin:0;opacity:.85}
.theme-btn{background:rgba(255,255,255,0.2); border:none; color:white; border-radius:50%; width:45px; height:45px; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink: 0;}
.theme-btn:hover{background:rgba(255,255,255,0.3);}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
button,.file-label{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
.filter{background:var(--card);color:var(--text);border:1px solid var(--border)}
.filter.active{background:var(--secondary);color:white;border-color:var(--secondary)}
main{padding:25px 18px 50px; width: 100%; overflow-x: hidden;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.stat strong{display:block;font-size:25px}.stat span{color:var(--muted);font-size:13px}
.timeline{position:relative}
.timeline:before{content:"";position:absolute;left:20px;top:10px;bottom:10px;width:3px;background:var(--border)}
.activity{position:relative;margin:0 0 18px 0;padding-left:54px; width: 100%;}
.dot{position:absolute;left:11px;top:22px;width:21px;height:21px;border-radius:50%;background:var(--secondary);border:4px solid var(--bg);z-index:1}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #0000000b; transition: all 0.2s; width: 100%; max-width: 100%;}
.card-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;padding:19px; cursor:pointer;}
.card-head:hover{background:var(--bg);}
.card-head-content {flex: 1; min-width: 0;} /* Añadido para evitar desbordamiento */
.date{font-size:13px;font-weight:800;color:var(--secondary);margin-bottom:5px}
.title{font-size:20px;font-weight:800;margin:0 0 7px; word-break: break-word;}
.responsible{color:var(--muted);font-size:14px; word-break: break-word;}
.badge{font-size:12px;padding:6px 10px;border-radius:20px;font-weight:800;white-space:nowrap; flex-shrink: 0;}
.pending{background:var(--bg);color:var(--pending); border:1px solid var(--pending)}
.approved{background:var(--bg);color:var(--approved); border:1px solid var(--approved)}
.done{background:var(--bg);color:var(--done); border:1px solid var(--done)}
.details{border-top:1px solid var(--border);padding:18px 19px;display:none; width: 100%;}
.card.open .details{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:35px; align-items:start; width: 100%;}
.section-title{font-size:13px;font-weight:800;margin-bottom:9px;text-transform:uppercase;color:var(--muted)}
.notes-log{font-size:14px; background:var(--bg); padding:12px; border-radius:10px; border:1px solid var(--border); margin-bottom:10px; max-height:250px; overflow-y:auto; overflow-wrap: anywhere; word-break: break-word;}
.notes-log a{color:var(--secondary); font-weight:bold; word-break: break-all;}
.notes{width:100%;max-width:100%;min-height:70px;background:var(--input-bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px;resize:vertical;font:inherit}
.files{display:flex;flex-direction:column;gap:8px; width:100%;}
.file-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);background:var(--bg);padding:9px 11px;border-radius:10px; width:100%;}
.file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px; flex: 1; min-width: 0;}
.file-actions{display:flex;gap:5px; flex-shrink: 0;}
.file-actions button{padding:6px 9px;font-size:12px}
.add{background:var(--secondary);color:white}
.delete{background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;}
body.dark-mode .delete{background:#450a0a; color:#fca5a5; border-color:#7f1d1d;}
.empty{color:var(--muted);font-size:14px; font-style:italic;}
.card-foot{display:flex;justify-content:flex-end;gap:8px;padding:17px 19px; border-top:1px solid var(--border); background:var(--bg); width: 100%;}
.toggle{background:var(--secondary);color:white;opacity:0.9;}
select, input{border:1px solid var(--border);border-radius:9px;padding:8px;background:var(--input-bg);color:var(--text);font-weight:600; width: 100%; max-width: 100%;}
.help{background:var(--card);border:1px dashed var(--muted);padding:16px;border-radius:14px;margin-bottom:20px;color:var(--text)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:10; overflow-y:auto;}
.modal.show{display:flex}.modal-box{background:var(--card);width:min(560px,100%);border-radius:18px;padding:24px;box-shadow:0 20px 60px #0005; max-height: 90vh; overflow-y:auto;}
.modal-box h2{margin-top:0}.form-grid{display:grid;gap:13px}.form-grid label{font-size:13px;font-weight:800;color:var(--muted)}
.form-grid input,.form-grid select{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;font:inherit;margin-top:5px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.cancel{background:var(--bg);color:var(--text);border:1px solid var(--border);}

/* --- MEJORAS RESPONSIVAS PARA MÓVILES --- */
@media(max-width:700px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .detail-grid{grid-template-columns:1fr; gap:25px;}
 .activity{padding-left:35px}
 .timeline:before{left:9px}
 .dot{left:0px; width: 19px; height: 19px;}
 .header-flex{flex-direction:column; align-items:flex-start;}
 .theme-btn{position:absolute; top:34px; right:22px;}
 .card-head {padding: 15px 12px;}
 .details {padding: 15px 12px;}
 .card-foot {padding: 15px 12px; flex-wrap: wrap; justify-content: stretch;}
 .card-foot button {flex: 1; text-align: center; justify-content: center;}
 .file-row {flex-direction: column; align-items: stretch; gap: 8px;}
 .file-name {white-space: normal; word-break: break-word;}
 .file-actions {justify-content: flex-end;}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
  <div class="container header-flex">
    <div>
      <h1>📅 Cronograma de Actividades</h1>
      <p class="subtitle">Planificación, responsables y archivos de cada actividad</p>
    </div>
    <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" title="Cambiar tema">🌙</button>
  </div>
</header>

<main class="container">
  <div class="toolbar">
    <button class="add" onclick="openActivityModal()">＋ Nueva actividad</button>
    <button class="filter active" data-filter="all">Todas</button>
    <button class="filter" data-filter="pending">Pendientes</button>
    <button class="filter" data-filter="approved">Aprobadas</button>
    <button class="filter" data-filter="done">Completadas</button>
  </div>

  <div class="stats">
    <div class="stat"><strong id="total">0</strong><span>Actividades</span></div>
    <div class="stat"><strong id="pendingCount">0</strong><span>Pendientes</span></div>
    <div class="stat"><strong id="approvedCount">0</strong><span>Aprobadas</span></div>
    <div class="stat"><strong id="doneCount">0</strong><span>Completadas</span></div>
  </div>

  <div class="help">
    <b>💡 Cómo usarlo:</b> Haz clic sobre el título de cualquier actividad para abrir sus detalles, guardar enlaces, agregar notas y gestionar archivos.
  </div>

  <section id="timeline" class="timeline"></section>
</main>

<div class="modal" id="activityModal">
 <div class="modal-box">
  <h2 id="modalTitle">Nueva actividad</h2>
  <div class="form-grid">
   <div><label>Actividad</label><input id="fTitle" placeholder="Nombre de la actividad"></div>
   <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
     <div><label>Fecha inicio</label><input type="date" id="fDateStart"></div>
     <div><label>Fecha fin (opcional)</label><input type="date" id="fDateEnd"></div>
   </div>
   <div><label>Sedes / Desglose de fechas</label><input id="fLocation" placeholder="Ej. Cúcuta 14, Villa 15, Pamplona 16"></div>
   <div><label>Responsable(s)</label><input id="fResponsible" placeholder="Nombre del responsable"></div>
   <div>
     <label>Estado</label>
     <select id="fStatus">
       <option value="pending">Pendiente</option>
       <option value="approved">Aprobado</option>
       <option value="done">Completada</option>
     </select>
   </div>
  </div>
  <div class="modal-actions">
   <button class="cancel" onclick="closeActivityModal()">Cancelar</button>
   <button class="add" onclick="saveActivity()">Guardar actividad</button>
  </div>
 </div>
</div>

<script>
// --- CONFIGURACIÓN DE TEMA OSCURO ---
function toggleTheme() {
  document.body.classList.toggle('dark-mode');
  const isDark = document.body.classList.contains('dark-mode');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
}
if(localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark-mode');
  document.getElementById('themeToggle').textContent = '☀️';
}
// ------------------------------------

const { createClient } = supabase;
const supabaseUrl = 'https://kakbjyjonxtbhobeiblv.supabase.co';
const supabaseKey = 'sb_publishable_BiXNML_8PgA2x6pd6UPWWg_EGJ8tMUW';
const supabaseClient = createClient(supabaseUrl, supabaseKey);

let activities = [];
let filesData = {};
const statusText={pending:"Pendiente", approved:"Aprobado", done:"Completada"};
let currentFilter="all";
let editingId=null;
let openCards = []; 

async function fetchData(){
  const { data: acts } = await supabaseClient.from('cronograma_actividades').select('*').order('id', { ascending: true });
  if(acts) activities = acts;
  const { data: files } = await supabaseClient.from('cronograma_archivos').select('*');
  filesData = {};
  if(files){
    files.forEach(f => {
      if(!filesData[f.activity_id]) filesData[f.activity_id] = [];
      filesData[f.activity_id].push(f);
    });
  }
  render();
}

supabaseClient.channel('realtime_sync')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'cronograma_actividades' }, payload => fetchData())
  .on('postgres_changes', { event: '*', schema: 'public', table: 'cronograma_archivos' }, payload => fetchData())
  .subscribe();

function openActivityModal(id=null){
 editingId=id;
 const a=id?activities.find(x=>x.id===id):null;
 document.getElementById("modalTitle").textContent=a?"Editar actividad":"Nueva actividad";
 document.getElementById("fTitle").value=a?.title||"";
 
 let dateStartVal = "";
 let dateEndVal = "";
 if(a?.date){
   const parts = a.date.split(' - ');
   const d1 = parts[0];
   const d2 = parts[1];
   if(d1){
     const p1 = d1.split('/');
     if(p1.length === 3) dateStartVal = `${p1[2]}-${p1[1].padStart(2, '0')}-${p1[0].padStart(2, '0')}`;
   }
   if(d2){
     const p2 = d2.split('/');
     if(p2.length === 3) dateEndVal = `${p2[2]}-${p2[1].padStart(2, '0')}-${p2[0].padStart(2, '0')}`;
   }
 }
 document.getElementById("fDateStart").value=dateStartVal;
 document.getElementById("fDateEnd").value=dateEndVal;
 document.getElementById("fLocation").value=a?.location||"";
 document.getElementById("fResponsible").value=a?.responsible||"";
 document.getElementById("fStatus").value=a?.status||"pending";
 document.getElementById("activityModal").classList.add("show");
}

function closeActivityModal(){document.getElementById("activityModal").classList.remove("show");}

async function saveActivity(){
 const title=document.getElementById("fTitle").value.trim();
 let rawStart = document.getElementById("fDateStart").value;
 let rawEnd = document.getElementById("fDateEnd").value;
 let finalDate = "";
 let d1Str = "";
 if(rawStart){
   const p = rawStart.split('-');
   if(p.length === 3) d1Str = `${p[2]}/${p[1]}/${p[0]}`;
 }
 let d2Str = "";
 if(rawEnd){
   const p = rawEnd.split('-');
   if(p.length === 3) d2Str = `${p[2]}/${p[1]}/${p[0]}`;
 }
 if(d1Str && d2Str && d1Str !== d2Str){
   finalDate = `${d1Str} - ${d2Str}`;
 } else if(d1Str) {
   finalDate = d1Str;
 }
 const location=document.getElementById("fLocation").value.trim();
 const responsible=document.getElementById("fResponsible").value.trim();
 const status=document.getElementById("fStatus").value;
 
 if(!title||!finalDate||!responsible){alert("Completa actividad, fecha de inicio y responsable.");return;}
 
 if(editingId){
   await supabaseClient.from('cronograma_actividades').update({title, date: finalDate, location, responsible, status}).eq('id', editingId);
 } else {
   await supabaseClient.from('cronograma_actividades').insert([{title, date: finalDate, location, responsible, status}]);
 }
 closeActivityModal();
}

function editActivity(id, e){
  e.stopPropagation();
  openActivityModal(id);
}

async function deleteActivity(id, e){
 e.stopPropagation();
 const a=activities.find(x=>x.id===id);
 if(!a)return;
 if(confirm(`¿Eliminar "${a.title}"? Esta acción no se puede deshacer.`)){
   await supabaseClient.from('cronograma_actividades').delete().eq('id', id);
 }
}

function activityDateValue(a){
 const m = String(a.date).match(/(\d{1,2})\D+(\d{1,2})(?:\D+(\d{2,4}))?/);
 if(!m) return Number.MAX_SAFE_INTEGER;
 const day = Number(m[1]), month = Number(m[2]);
 let year = m[3] ? Number(m[3]) : new Date().getFullYear();
 if(year < 100) year += 2000;
 return new Date(year, month-1, day).getTime();
}

function toggleCard(id){
  const card = document.getElementById("card-"+id);
  card.classList.toggle("open");
  if(card.classList.contains("open")){
    if(!openCards.includes(id)) openCards.push(id);
  } else {
    openCards = openCards.filter(x => x !== id);
  }
}

function linkify(text) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  return escapeHtml(text).replace(urlRegex, function(url) {
    return `<a href="${url}" target="_blank">${url}</a>`;
  });
}

function escapeHtml(s){
 return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

// --- LÓGICA PARA RENDERIZAR Y BORRAR NOTAS ---
function renderNotesLog(id, rawNotes) {
  if(!rawNotes) return '<div class="empty">Aún no hay notas registradas.</div>';
  let notesArray = rawNotes.split('\n\n• ').filter(n => n.trim() !== '');
  notesArray = notesArray.map(n => n.replace(/^•\s*/, ''));
  
  return notesArray.map((note, idx) => `
    <div style="display:flex; justify-content:space-between; gap:10px; margin-bottom:10px; border-bottom:1px solid var(--border); padding-bottom:10px;">
      <div style="flex:1; white-space:pre-wrap; word-break:break-word;">${linkify(note)}</div>
      <button class="delete" style="padding:4px 8px; font-size:10px; height:max-content; border-radius:6px;" onclick="deleteNote(${id}, ${idx})" title="Borrar nota">❌</button>
    </div>
  `).join('');
}

async function deleteNote(id, index) {
  if(!confirm("¿Seguro que quieres borrar esta nota del registro?")) return;
  const a = activities.find(x => x.id === id);
  let notesArray = a.notes.split('\n\n• ').filter(n => n.trim() !== '');
  notesArray = notesArray.map(n => n.replace(/^•\s*/, ''));
  
  notesArray.splice(index, 1);
  let newNotes = notesArray.map(n => "• " + n).join('\n\n');
  if(newNotes === "") newNotes = null;
  
  const { error } = await supabaseClient.from('cronograma_actividades').update({notes: newNotes}).eq('id', id);
  if(error) alert("Error al borrar la nota: " + error.message);
}
// ---------------------------------------------

function render(){
 const box=document.getElementById("timeline"); box.innerHTML="";
 let shown=activities.filter(a=>currentFilter==="all"||a.status===currentFilter);
 shown.sort((a,b)=>activityDateValue(a)-activityDateValue(b));
 shown.forEach(a=>{
  const fList = filesData[a.id] || [];
  const isOpen = openCards.includes(a.id) ? 'open' : '';
  
  const el=document.createElement("article");
  el.className="activity";
  el.innerHTML=`
   <div class="dot"></div>
   <div class="card ${isOpen}" id="card-${a.id}">
    
    <div class="card-head" onclick="toggleCard(${a.id})" title="Haz clic para ver o cerrar detalles">
     <div class="card-head-content">
      <div class="date">${a.date}</div>
      <h2 class="title">${a.title}</h2>
      ${a.location ? `<div class="responsible" style="margin-bottom:4px; color:var(--secondary)">📍 <b>Sedes:</b> ${a.location}</div>` : ''}
      <div class="responsible">👤 <b>Responsable:</b> ${a.responsible}</div>
     </div>
     <span class="badge ${a.status}">${statusText[a.status]}</span>
    </div>
    
    <div class="details">
     <div class="detail-grid">
      
      <div>
       <div class="section-title">Actualizar Estado</div>
       <select onchange="changeStatus(${a.id},this.value)">
        <option value="pending" ${a.status==="pending"?"selected":""}>Pendiente</option>
        <option value="approved" ${a.status==="approved"?"selected":""}>Aprobado</option>
        <option value="done" ${a.status==="done"?"selected":""}>Completada</option>
       </select>
       
       <div class="section-title" style="margin-top:24px">Historial de Observaciones y Enlaces</div>
       <div class="notes-log">
          ${renderNotesLog(a.id, a.notes)}
       </div>
       <textarea id="new-note-${a.id}" class="notes" placeholder="Escribe una nueva nota o pega un link aquí..."></textarea>
       <button class="add" style="margin-top:8px" onclick="appendNote(${a.id},this)">Guardar en el registro</button>
      </div>
      
      <div>
       <div class="section-title">Archivos correspondientes</div>
       <div class="files" id="files-${a.id}">
        ${fileHTML(a,fList)}
       </div>
       <label class="file-label add" style="display:inline-block;margin-top:10px">
        📎 Agregar archivo
        <input type="file" multiple hidden onchange="addFiles(${a.id},this)">
       </label>
      </div>
     
     </div>
    </div>
    
    <div class="card-foot">
      <button class="toggle" onclick="editActivity(${a.id}, event)">✏️ Editar Actividad</button>
      <button class="delete" onclick="deleteActivity(${a.id}, event)">🗑️ Eliminar Actividad</button>
    </div>
   </div>
  `;
  box.appendChild(el);
 });
 updateStats();
}

function fileHTML(a,files){
 if(!files.length)return '<div class="empty">No hay archivos asociados todavía.</div>';
 return files.map(f=>`
  <div class="file-row">
   <span class="file-name" title="${escapeHtml(f.name)}">📄 ${escapeHtml(f.name)}</span>
   <div class="file-actions">
    <button class="toggle" onclick="downloadFile('${f.path}')">Abrir</button>
    <button class="delete" onclick="removeFile(${f.id}, '${f.path}')">Eliminar</button>
   </div>
  </div>`).join("");
}

async function changeStatus(id,status){
 await supabaseClient.from('cronograma_actividades').update({status}).eq('id', id);
}

async function appendNote(id, btn){
 const textarea = document.getElementById("new-note-"+id);
 const newText = textarea.value.trim();
 if(!newText) return;
 btn.textContent = "⏳ Guardando...";
 const a = activities.find(x => x.id === id);
 let updatedNotes = a.notes ? a.notes + "\n\n• " + newText : "• " + newText;
 const { error } = await supabaseClient.from('cronograma_actividades').update({notes: updatedNotes}).eq('id', id);
 if(error){
   alert("Error al guardar: " + error.message);
   btn.textContent = "Guardar en el registro";
 } else {
   textarea.value = "";
   btn.textContent = "✓ ¡Guardado!";
   setTimeout(() => btn.textContent = "Guardar en el registro", 1500);
 }
}

async function addFiles(id, input){
  const files = Array.from(input.files);
  if (files.length === 0) return;
  const labelDiv = input.parentElement;
  const originalText = labelDiv.innerHTML;
  labelDiv.innerHTML = "⏳ Subiendo...";
  try {
    for(let file of files){
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
      const { error: uploadError } = await supabaseClient.storage.from('cronograma-archivos').upload(fileName, file);
      if(uploadError){
        alert("Error al subir el archivo: " + uploadError.message);
      } else {
        const { error: dbError } = await supabaseClient.from('cronograma_archivos').insert([{activity_id: id, name: file.name, path: fileName, type: file.type}]);
        if(dbError) alert("Error en base de datos: " + dbError.message);
      }
    }
    await fetchData(); 
  } catch (err) {
    alert("Fallo inesperado: " + err.message);
  } finally {
    labelDiv.innerHTML = originalText;
    input.value = "";
  }
}

async function downloadFile(path){
 const { data } = supabaseClient.storage.from('cronograma-archivos').getPublicUrl(path);
 if(data) window.open(data.publicUrl, '_blank');
}

async function removeFile(fileId, path){
 if(confirm("¿Seguro que quieres eliminar este archivo?")){
   await supabaseClient.storage.from('cronograma-archivos').remove([path]);
   await supabaseClient.from('cronograma_archivos').delete().eq('id', fileId);
 }
}

function updateStats(){
 document.getElementById("total").textContent=activities.length;
 document.getElementById("pendingCount").textContent=activities.filter(a=>a.status==="pending").length;
 document.getElementById("approvedCount").textContent=activities.filter(a=>a.status==="approved").length;
 document.getElementById("doneCount").textContent=activities.filter(a=>a.status==="done").length;
}

document.querySelectorAll(".filter").forEach(btn=>{
 btn.addEventListener("click",()=>{
  document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active"); currentFilter=btn.dataset.filter; render();
 });
});

document.getElementById("activityModal").addEventListener("click",e=>{if(e.target.id==="activityModal")closeActivityModal();});
window.onload = fetchData;
</script>
</body>
</html>
